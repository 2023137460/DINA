<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Thaw timer">
<title>Thaw timer</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .h1{transform-origin:24px 25px;animation:dina-spin 12s linear infinite}.dina-icon .h2{transform-origin:24px 25px;animation:dina-spin 144s linear infinite}@keyframes dina-spin{to{transform:rotate(360deg)}}</style>
<circle class="d " style="--i:0" pathLength="1" cx="24" cy="25" r="17"/><path class="d " style="--i:1" pathLength="1" d="M20 5H28M24 5V8"/><path class="d " style="--i:2" pathLength="1" d="M24 11.5L24 9.5"/><path class="d " style="--i:2" pathLength="1" d="M37.5 25L39.5 25"/><path class="d " style="--i:2" pathLength="1" d="M24 38.5L24 40.5"/><path class="d " style="--i:2" pathLength="1" d="M10.5 25L8.5 25"/><g class="vb h1"><path class="d ac" style="--i:3" pathLength="1" d="M24 25V14"/></g><g class="vb h2"><path class="d " style="--i:3" pathLength="1" d="M24 25H30"/></g><circle class="fl " cx="24" cy="25" r="1.6"/>
</svg>
