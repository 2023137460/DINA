<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DINA Smart Freezer Logo">
  <title>DINA — Defrosting Is Now Automatic</title>
  <!-- Warm Paper Background Tile -->
  <rect width="512" height="512" fill="#F1EFE5"/>
  <!-- Outer Architectural Frame -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#191919" stroke-width="10"/>
  <rect x="34" y="34" width="444" height="444" fill="none" stroke="#9E9696" stroke-width="2"/>

  <!-- Deck-Style Offset Sand Silhouette -->
  <rect x="156" y="78" width="224" height="316" rx="14" fill="#DAD8CB"/>

  <!-- Main Upright Freezer Cabinet Body -->
  <rect x="142" y="64" width="224" height="316" rx="14" fill="#F1EFE5" stroke="#191919" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upper Freezer Door Vertical Handle -->
  <line x1="322" y1="116" x2="322" y2="212" stroke="#191919" stroke-width="14" stroke-linecap="round"/>

  <!-- Thermal Airlock Partition Divider Line -->
  <line x1="142" y1="256" x2="366" y2="256" stroke="#191919" stroke-width="14" stroke-linecap="round"/>

  <!-- Lower Defrost Drawer Handle Bars -->
  <line x1="184" y1="318" x2="214" y2="318" stroke="#191919" stroke-width="14" stroke-linecap="round"/>
  <line x1="294" y1="318" x2="324" y2="318" stroke="#191919" stroke-width="14" stroke-linecap="round"/>

  <!-- Signature Clay LED Halo Ring on Drawer Handle -->
  <circle cx="254" cy="318" r="24" fill="#F1EFE5" stroke="#C0775B" stroke-width="14"/>

  <!-- DINA Editorial Wordmark -->
  <text x="256" y="444" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="54" font-weight="700" letter-spacing="14" fill="#191919">DINA</text>
</svg>
