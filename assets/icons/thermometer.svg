<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Safe-hold temperature">
<title>Safe-hold temperature</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .merc path{stroke-dasharray:1;animation:dina-merc 5s ease-in-out infinite 1.4s}@keyframes dina-merc{0%,100%{stroke-dashoffset:.55}50%{stroke-dashoffset:0}}</style>
<path class="d " style="--i:0" pathLength="1" d="M20 29V12a4 4 0 0 1 8 0V29a8 8 0 1 1 -8 0Z"/><path class="d " style="--i:2" pathLength="1" d="M32 14H36M32 20H36M32 26H36"/><g class="merc"><path class="d ac" style="--i:3" pathLength="1" d="M24 33V17"/></g><circle class="fl " cx="24" cy="36" r="3.2"/>
</svg>
