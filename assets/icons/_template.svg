<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="DESCRIBE THE ICON">
<title>DESCRIBE THE ICON</title>
<!-- TEMPLATE for new DINA icons. Copy the <style> block unchanged, then add shapes below.
     Rules: 48x48 grid, 4px safe margin, 1.5 stroke, round caps and joins, outline only.
     Every shape gets class="d" plus style="--i:N" (draw-in order) and pathLength="1".
     Use class="ac" (terracotta stroke) or class="fl" (terracotta dot) on ONE detail only.
     Optional ambient loop: wrap shapes in <g class="vb loop"> and add a keyframe in the style block
     with a unique name (dina-yourname-loop), slow and gentle, 3s to 40s. -->
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}</style>
<path class="d" style="--i:0" pathLength="1" d="M10 24H38"/>
<path class="d ac" style="--i:1" pathLength="1" d="M28 14L38 24L28 34"/>
</svg>
