<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Companion mobile app">
<title>Companion mobile app</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .knob{transform-origin:24px 27px;animation:dina-knob 4.5s ease-in-out infinite}@keyframes dina-knob{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}</style>
<rect class="d " style="--i:0" pathLength="1" x="13" y="4" width="22" height="40" rx="4"/><path class="d " style="--i:1" pathLength="1" d="M21 8H27"/><rect class="d " style="--i:2" pathLength="1" x="17" y="14" width="6" height="3.5" rx="1.7"/><rect class="d " style="--i:2" pathLength="1" x="25" y="14" width="6" height="3.5" rx="1.7"/><path class="d " style="--i:3" pathLength="1" d="M17 27H31"/><g class="vb knob"><circle class="d ac" style="--i:4" pathLength="1" cx="24" cy="27" r="2.4"/></g><path class="d " style="--i:4" pathLength="1" d="M21 39H27"/>
</svg>
