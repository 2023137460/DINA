<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Deep freeze storage">
<title>Deep freeze storage</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .spin{transform-origin:24px 24px;animation:dina-snow 40s linear infinite}@keyframes dina-snow{to{transform:rotate(360deg)}}</style>
<g class="vb spin"><g transform="rotate(0 24 24)"><path class="d " style="--i:1" pathLength="1" d="M24 7V41"/><path class="d " style="--i:2" pathLength="1" d="M20.5 11L24 14.5L27.5 11"/><path class="d " style="--i:2" pathLength="1" d="M20.5 37L24 33.5L27.5 37"/></g><g transform="rotate(60 24 24)"><path class="d " style="--i:1" pathLength="1" d="M24 7V41"/><path class="d " style="--i:2" pathLength="1" d="M20.5 11L24 14.5L27.5 11"/><path class="d " style="--i:2" pathLength="1" d="M20.5 37L24 33.5L27.5 37"/></g><g transform="rotate(120 24 24)"><path class="d " style="--i:1" pathLength="1" d="M24 7V41"/><path class="d " style="--i:2" pathLength="1" d="M20.5 11L24 14.5L27.5 11"/><path class="d " style="--i:2" pathLength="1" d="M20.5 37L24 33.5L27.5 37"/></g></g><circle class="d ac" style="--i:3" pathLength="1" cx="24" cy="24" r="2.4"/>
</svg>
