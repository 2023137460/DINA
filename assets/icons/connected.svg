<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Wi-Fi and Matter connectivity">
<title>Wi-Fi and Matter connectivity</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .a1,.dina-icon .a2,.dina-icon .a3{animation:dina-wave 2.6s ease-in-out infinite}.dina-icon .a2{animation-delay:.25s}.dina-icon .a3{animation-delay:.5s}@keyframes dina-wave{0%,100%{opacity:1}50%{opacity:.25}}</style>
<g class="a3"><path class="d " style="--i:0" pathLength="1" d="M7 19a24 24 0 0 1 34 0"/></g><g class="a2"><path class="d " style="--i:1" pathLength="1" d="M12 25a16.5 16.5 0 0 1 24 0"/></g><g class="a1"><path class="d " style="--i:2" pathLength="1" d="M17.5 31a8.5 8.5 0 0 1 13 0"/></g><circle class="fl " cx="24" cy="37" r="2"/>
</svg>
