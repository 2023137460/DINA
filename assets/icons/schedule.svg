<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Dinner schedule">
<title>Dinner schedule</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .pulse{transform-origin:33.5px 34px;animation:dina-halo 2.8s ease-in-out infinite}@keyframes dina-halo{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}</style>
<rect class="d " style="--i:0" pathLength="1" x="6" y="9" width="36" height="33" rx="3"/><path class="d " style="--i:1" pathLength="1" d="M6 18H42"/><path class="d " style="--i:1" pathLength="1" d="M15 5V12M33 5V12"/><path class="d " style="--i:2" pathLength="1" d="M13 26H16M22.5 26H25.5M32 26H35"/><path class="d " style="--i:2" pathLength="1" d="M13 34H16M22.5 34H25.5"/><g class="vb pulse"><circle class="d ac" style="--i:3" pathLength="1" cx="33.5" cy="34" r="3.6"/></g>
</svg>
