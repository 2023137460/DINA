<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Two-tier revolving meal drum">
<title>Two-tier revolving meal drum</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .spin{transform-origin:24px 24px;animation:dina-drum 24s linear infinite}@keyframes dina-drum{to{transform:rotate(360deg)}}</style>
<circle class="d " style="--i:0" pathLength="1" cx="24" cy="24" r="19"/><circle class="d " style="--i:1" pathLength="1" cx="24" cy="24" r="4"/><g class="vb spin"><path class="d " style="--i:2" pathLength="1" d="M24 20L24 5"/><path class="d " style="--i:2" pathLength="1" d="M27.46 22L40.45 14.5"/><path class="d " style="--i:2" pathLength="1" d="M27.46 26L40.45 33.5"/><path class="d " style="--i:2" pathLength="1" d="M24 28L24 43"/><path class="d " style="--i:2" pathLength="1" d="M20.54 26L7.55 33.5"/><path class="d " style="--i:2" pathLength="1" d="M20.54 22L7.55 14.5"/><circle class="d " style="--i:3" pathLength="1" cx="36" cy="24" r="2.6"/><circle class="d " style="--i:3" pathLength="1" cx="30" cy="34.39" r="2.6"/><circle class="d " style="--i:3" pathLength="1" cx="18" cy="34.39" r="2.6"/><circle class="d " style="--i:3" pathLength="1" cx="12" cy="24" r="2.6"/><circle class="d " style="--i:3" pathLength="1" cx="18" cy="13.61" r="2.6"/></g>
</svg>
