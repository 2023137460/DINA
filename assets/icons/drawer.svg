<svg xmlns="http://www.w3.org/2000/svg" class="dina-icon" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Defrost drawer with halo handle">
<title>Defrost drawer with halo handle</title>
<style>svg.dina-icon{--ink:#191919;--accent:#C0775B}
.dina-icon *{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dina-icon .ac{stroke:var(--accent)}
.dina-icon .fl{fill:var(--accent);stroke:none}
.dina-icon .d{animation:dina-draw 1.1s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*.08s)}
@keyframes dina-draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
.dina-icon .vb{transform-box:view-box}
@media (prefers-reduced-motion:reduce){.dina-icon *{animation:none!important}}
.dina-icon .pulse{transform-origin:24px 36px;animation:dina-halo 2.8s ease-in-out infinite}@keyframes dina-halo{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}</style>
<rect class="d " style="--i:0" pathLength="1" x="10" y="5" width="28" height="38" rx="2"/><path class="d " style="--i:1" pathLength="1" d="M10 28H38"/><path class="d " style="--i:2" pathLength="1" d="M32 12V21"/><g class="vb pulse"><circle class="d ac" style="--i:3" pathLength="1" cx="24" cy="36" r="3"/></g><path class="d " style="--i:3" pathLength="1" d="M18 36H15"/><path class="d " style="--i:3" pathLength="1" d="M33 36H30"/>
</svg>
